[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "convertly-cli"
dynamic = ["version"]
description = "Private, local file conversion with automatic multi-step routing: CLI, Python API and a drag-and-drop web UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Atomesus Team", email = "marketing@atomesus.com" }]
keywords = ["converter", "file-conversion", "pdf", "images", "ffmpeg", "cli", "privacy", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Utilities",
]
dependencies = [
  "pillow>=10.3",
  "pypdf>=4.2",
  "pypdfium2>=4.30",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
  "defusedxml>=0.7.1",
  "markdown>=3.5",
  "reportlab>=4.0",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "build>=1.2"]

[project.scripts]
convertly = "convertly.cli:main"

[project.urls]
Homepage = "https://github.com/Ethos6/convertly"
Issues = "https://github.com/Ethos6/convertly/issues"
Changelog = "https://github.com/Ethos6/convertly/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/convertly/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/convertly"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "ffmpeg: needs FFmpeg",
  "libreoffice: needs LibreOffice (slow)",
  "pandoc: needs Pandoc",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "N", "RUF"]
ignore = ["S101", "S603", "S607", "B008", "N806", "N818", "RUF012", "RUF001", "RUF002", "RUF003", "UP007", "UP045", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "N", "RUF"]
